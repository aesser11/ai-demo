version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    networks:
      - webapp-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - webapp-network

networks:
  webapp-network:
    driver: bridge